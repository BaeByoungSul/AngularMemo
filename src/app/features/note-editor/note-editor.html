<div class="note-manager-layout">

  <div class="note-list-panel">
    <h2>📓 내 노트 목록</h2>
    
    <button (click)="startAddMode()" class="btn-add-new">
      ➕ 새 노트 작성
    </button>
    
    <div *ngIf="notes$ | async as notes; else loading">
      <div *ngIf="notes.length > 0; else noNotes">
        <div 
          *ngFor="let note of notes" 
          class="note-item"
          [class.selected]="note.id === selectedNote?.id"
        >
          <span class="note-title" (click)="selectNote(note)">
            {{ note.title }}
          </span>
          <button (click)="onDelete(note.id!)" class="btn-delete">🗑️</button>
        </div>
      </div>
      <ng-template #noNotes>
        <p class="empty-message">작성된 노트가 없습니다.</p>
      </ng-template>
    </div>
    <ng-template #loading>
      <p>노트 로딩 중...</p>
    </ng-template>
  </div>

  <div class="note-detail-panel">
    <h2>
      {{ selectedNote ? '📝 노트 수정' : '➕ 새 노트 작성' }}
    </h2>
    
    <form [formGroup]="noteForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="title">제목</label>
        <input id="title" type="text" formControlName="title" class="form-control">
        <div 
          *ngIf="noteForm.get('title')?.invalid && (noteForm.get('title')?.dirty || noteForm.get('title')?.touched)" 
          class="error-message"
        >
          제목은 필수입니다.
        </div>
      </div>

      <div class="form-group">
        <label for="content">내용</label>
        <textarea id="content" formControlName="content" rows="10" class="form-control"></textarea>
      </div>

      <button 
        type="submit" 
        class="btn btn-primary" 
        [disabled]="noteForm.invalid"
      >
        {{ selectedNote ? '수정 사항 저장' : '노트 추가' }}
      </button>

      <button 
        *ngIf="selectedNote" 
        type="button" 
        (click)="startAddMode()" 
        class="btn btn-secondary"
      >
        취소 및 새 노트 작성
      </button>
    </form>
  </div>
</div>
